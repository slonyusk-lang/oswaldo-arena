
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Oswaldo Arena | Zombie City</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;z-index:3;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#081321d9;border:1px solid #4b6b8d;border-radius:12px;padding:10px 12px;box-shadow:0 4px 18px #0006;font-size:13px}
#healthBar{width:130px;height:8px;background:#47232a;border-radius:8px;margin-top:5px;overflow:hidden}
#healthFill{height:100%;width:100%;background:#4ce49b;transition:width .2s}
#help{position:fixed;top:92px;left:12px;z-index:3;background:#081321bb;padding:8px 10px;border-radius:8px;font-size:11px;color:#b9c9dc;pointer-events:none}
#joy{position:fixed;left:22px;bottom:25px;width:130px;height:130px;border:2px solid #7bc9ff8a;border-radius:50%;background:#14273d88;z-index:5;touch-action:none}
#knob{position:absolute;width:48px;height:48px;left:39px;top:39px;border-radius:50%;background:#6bc9ffcc;border:2px solid #d7f4ff;box-shadow:0 0 18px #4dbdff55;pointer-events:none}
#shoot{position:fixed;right:25px;bottom:38px;width:88px;height:88px;border-radius:50%;border:2px solid #ffc0c0;background:linear-gradient(145deg,#ff5b63,#9d172a);color:#fff;font-weight:900;font-size:14px;z-index:5;box-shadow:0 0 24px #f33a5555;touch-action:none}
#action{position:fixed;right:25px;bottom:140px;width:72px;height:45px;border:1px solid #82dfff;background:#0a314bd9;color:#fff;border-radius:12px;z-index:5;font-weight:bold;font-size:11px}
#message{position:fixed;top:40%;left:5%;width:90%;text-align:center;font-size:clamp(24px,6vw,44px);font-weight:900;text-shadow:0 4px 15px #000;z-index:4;pointer-events:none}
#submessage{font-size:14px;color:#d4e7ff;margin-top:10px}
#start{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);z-index:6;border:0;border-radius:12px;background:#39d8ff;color:#061323;font-size:16px;font-weight:900;padding:14px 25px}
#mini{position:fixed;right:12px;top:88px;width:92px;height:92px;border-radius:50%;border:2px solid #7bb7df;background:#07111cbb;z-index:2}
#foot{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);font-size:9px;color:#a6b4c6;z-index:2;white-space:nowrap;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">
    <b>OSWALDO ARENA</b><br>
    <span style="color:#83dcff">ZOMBIE CITY</span>
    <div style="margin-top:7px">❤️ <span id="health">100</span></div>
    <div id="healthBar"><div id="healthFill"></div></div>
  </div>
  <div class="panel" style="text-align:right">
    ☠ Kills: <b id="kills">0</b><br>
    🌊 Wave: <b id="wave">1</b><br>
    🔫 Ammo: <b id="ammo">∞</b>
  </div>
</div>

<div id="help">JOYSTICK: MOVE · SHOOT: FIRE<br>Explore the city and survive!</div>
<canvas id="mini" width="184" height="184"></canvas>
<div id="message">ZOMBIE CITY<div id="submessage">Survive the outbreak.</div></div>
<button id="start">ENTER CITY</button>

<div id="joy"><div id="knob"></div></div>
<button id="action">SPRINT</button>
<button id="shoot">🔫<br>SHOOT</button>
<div id="foot">FICTIONAL GAME · VIRTUAL GAMEPLAY ONLY</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const root=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8295a8);
scene.fog=new THREE.Fog(0x8295a8,45,190);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc6e1ff,0x263023,2));
const sun=new THREE.DirectionalLight(0xffe1b5,2.3);
sun.position.set(-35,70,25);
scene.add(sun);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x424c50);
const roadMat=mat(0x242a30);
const sidewalkMat=mat(0x747a7b);
const lineMat=mat(0xd9c878);
const buildingMats=[0x697886,0x8d7768,0x535e70,0x797e7b,0x5b6976].map(c=>mat(c));
const greenMat=mat(0x294d39);
const trunkMat=mat(0x59432e);
const playerMat=mat(0x237eae);
const skinMat=mat(0xc9a27b);
const zombieMat=mat(0x658b58);
const darkMat=mat(0x25342c);
const gunMat=mat(0x303741);
const bulletMat=new THREE.MeshBasicMaterial({color:0xffe18a});

function box(parent,w,h,d,material,x,y,z){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y,z);parent.add(mesh);return mesh;
}

const ground=box(scene,360,.5,360,groundMat,0,-.4,0);

// City roads, sidewalks and yellow road markings.
for(let i=-3;i<=3;i++){
  box(scene,12,.04,360,roadMat,i*42,-.12,0);
  box(scene,360,.04,12,roadMat,0,-.12,i*42);
  box(scene,1,.06,360,sidewalkMat,i*42+7,-.08,0);
  box(scene,1,.06,360,sidewalkMat,i*42-7,-.08,0);
  box(scene,360,.06,1,sidewalkMat,0,-.08,i*42+7);
  box(scene,360,.06,1,sidewalkMat,0,-.08,i*42-7);
  for(let n=-8;n<=8;n++){
    box(scene,.12,.03,3,lineMat,i*42,-.075,n*20+10);
    box(scene,3,.03,.12,lineMat,n*20+10,-.075,i*42);
  }
}

// Buildings occupy blocks between roads.
for(let x=-3;x<=3;x++){
  for(let z=-3;z<=3;z++){
    if(Math.abs(x)<1&&Math.abs(z)<1)continue;
    const bx=x*42+(Math.random()-.5)*13;
    const bz=z*42+(Math.random()-.5)*13;
    const w=13+Math.random()*8;
    const d=13+Math.random()*8;
    const h=8+Math.random()*24;
    const b=box(scene,w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)],bx,h/2-.1,bz);
    b.rotation.y=(Math.random()-.5)*.12;
    // Windows on front and side walls.
    const windowMat=new THREE.MeshStandardMaterial({color:0x9ac7d8,emissive:0x182d39,roughness:.35});
    for(let floor=1;floor<h/3;floor++){
      for(let col=-1;col<=1;col++){
        box(scene,1.25,1.1,.06,windowMat,bx+col*w*.27,floor*2.7,bz+d/2+.04);
        box(scene,.06,1.1,1.25,windowMat,bx+w/2+.04,floor*2.7,bz+col*d*.27);
      }
    }
    // Rooftop structure.
    if(Math.random()>.45)box(scene,w*.35,1.5,d*.35,buildingMats[2],bx,h+0.65,bz);
  }
}

// Trees and street lamps.
for(let i=0;i<85;i++){
  const x=(Math.random()-.5)*300,z=(Math.random()-.5)*300;
  if(Math.abs(x%42)<10||Math.abs(z%42)<10)continue;
  box(scene,.5,2.4,.5,trunkMat,x,1.2,z);
  const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.7,1),greenMat);
  crown.position.set(x,3.4,z);scene.add(crown);
}
const lampMat=new THREE.MeshStandardMaterial({color:0xffdf9b,emissive:0x66441a});
for(let i=-3;i<=3;i++){
  for(let j=-3;j<=3;j++){
    const x=i*42+9,z=j*42+9;
    box(scene,.16,4,.16,gunMat,x,2,z);
    box(scene,1,.12,.12,gunMat,x+.4,4,z);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),lampMat);
    bulb.position.set(x+.85,3.9,z);scene.add(bulb);
  }
}

// Third-person survivor.
const player=new THREE.Group();
scene.add(player);
box(player,1,1.35,.65,playerMat,0,1.25,0);
const head=new THREE.Mesh(new THREE.SphereGeometry(.36,12,10),skinMat);
head.position.y=2.15;player.add(head);
box(player,.28,.9,.3,gunMat,-.28,.5,0);
box(player,.22,.65,.25,skinMat,.62,1.1,0);
const gun=box(player,.18,.18,1.05,gunMat,.48,1.28,-.68);
const muzzle= new THREE.Object3D();muzzle.position.set(.48,1.28,-1.25);player.add(muzzle);
player.position.set(0,0,0);

const zombies=[];
function makeZombie(x,z){
  const g=new THREE.Group();
  box(g,.85,1.25,.6,zombieMat,0,1.05,0);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.31,10,8),skinMat);
  h.position.y=1.9;g.add(h);
  box(g,.24,.85,.25,darkMat,-.52,1.05,0);
  box(g,.24,.85,.25,darkMat,.52,1.05,0);
  box(g,.27,.85,.3,darkMat,-.25,.38,0);
  box(g,.27,.85,.3,darkMat,.25,.38,0);
  g.position.set(x,0,z);
  scene.add(g);
  zombies.push({g,hp:2,speed:1.3+Math.random()*1.2,attack:0});
}

const bullets=[];
const bulletGeo=new THREE.SphereGeometry(.12,6,6);
let health=100,kills=0,wave=1,playing=false,shooting=false;
let spawnTimer=0,fireTimer=0,elapsed=0;
let joyX=0,joyY=0,joyActive=false,sprinting=false;
const clock=new THREE.Clock();
const v1=new THREE.Vector3(),v2=new THREE.Vector3();

function updateHUD(){
  document.getElementById("health").textContent=Math.max(0,health);
  document.getElementById("healthFill").style.width=Math.max(0,health)+"%";
  document.getElementById("kills").textContent=kills;
  document.getElementById("wave").textContent=wave;
}

function shoot(){
  if(!playing)return;
  let target=null,best=32;
  for(const z of zombies){
    const dist=z.g.position.distanceTo(player.position);
    if(dist<best){
      v1.set(0,0,-1).applyQuaternion(player.quaternion);
      v2.copy(z.g.position).sub(player.position).normalize();
      if(v1.dot(v2)>.15){best=dist;target=z;}
    }
  }
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
  if(target){
    dir.copy(target.g.position).sub(muzzle.getWorldPosition(v1)).normalize();
    target.hp--;
    if(target.hp<=0){
      scene.remove(target.g);
      zombies.splice(zombies.indexOf(target),1);
      kills++;
      if(kills%8===0)wave++;
      updateHUD();
    }
  }
  const start=muzzle.getWorldPosition(new THREE.Vector3());
  const mesh=new THREE.Mesh(bulletGeo,bulletMat);
  mesh.position.copy(start);scene.add(mesh);
  bullets.push({mesh,dir,life:.35});
}

function spawnZombie(){
  const a=Math.random()*Math.PI*2;
  const d=22+Math.random()*14;
  makeZombie(player.position.x+Math.cos(a)*d,player.position.z+Math.sin(a)*d);
}

function gameOver(){
  playing=false;shooting=false;
  document.getElementById("message").innerHTML=
    "YOU WERE OVERRUN<div id='submessage'>Kills: "+kills+" · Wave: "+wave+"</div>";
  document.getElementById("start").textContent="PLAY AGAIN";
  document.getElementById("start").classList.remove("hidden");
}

function resetGame(){
  for(const z of zombies)scene.remove(z.g);
  for(const b of bullets)scene.remove(b.mesh);
  zombies.length=0;bullets.length=0;
  player.position.set(0,0,0);player.rotation.y=0;
  health=100;kills=0;wave=1;elapsed=0;spawnTimer=0;fireTimer=0;
  playing=true;shooting=false;
  document.getElementById("message").classList.add("hidden");
  document.getElementById("start").classList.add("hidden");
  updateHUD();
  for(let i=0;i<4;i++)spawnZombie();
}

// Joystick.
const joy=document.getElementById("joy");
const knob=document.getElementById("knob");
function moveJoy(e){
  const r=joy.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const max=42,d=Math.hypot(x,y);
  if(d>max){x=x/d*max;y=y/d*max;}
  joyX=x/max;joyY=y/max;
  knob.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener("pointerdown",e=>{
  e.preventDefault();joyActive=true;joy.setPointerCapture(e.pointerId);moveJoy(e);
});
joy.addEventListener("pointermove",e=>{if(joyActive)moveJoy(e)});
function releaseJoy(){joyActive=false;joyX=0;joyY=0;knob.style.transform="translate(0,0)";}
joy.addEventListener("pointerup",releaseJoy);
joy.addEventListener("pointercancel",releaseJoy);

// Hold-to-fire.
const shootBtn=document.getElementById("shoot");
shootBtn.addEventListener("pointerdown",e=>{e.preventDefault();shooting=true;shootBtn.setPointerCapture(e.pointerId)});
function releaseFire(){shooting=false;}
shootBtn.addEventListener("pointerup",releaseFire);
shootBtn.addEventListener("pointercancel",releaseFire);
shootBtn.addEventListener("lostpointercapture",releaseFire);
document.getElementById("action").addEventListener("pointerdown",()=>{sprinting=true});
document.getElementById("action").addEventListener("pointerup",()=>{sprinting=false});
document.getElementById("action").addEventListener("pointercancel",()=>{sprinting=false});

document.getElementById("start").addEventListener("click",resetGame);

const mini=document.getElementById("mini");
const mc=mini.getContext("2d");
function drawMini(){
  mc.clearRect(0,0,184,184);
  mc.fillStyle="#101f2e";mc.fillRect(0,0,184,184);
  mc.strokeStyle="#3d5368";
  for(let i=0;i<184;i+=23){mc.beginPath();mc.moveTo(i,0);mc.lineTo(i,184);mc.stroke();mc.beginPath();mc.moveTo(0,i);mc.lineTo(184,i);mc.stroke();}
  mc.fillStyle="#3be0ff";mc.beginPath();mc.arc(92,92,5,0,7);mc.fill();
  mc.fillStyle="#ff555e";
  for(const z of zombies){
    const x=92+(z.g.position.x-player.position.x)*1.5;
    const y=92+(z.g.position.z-player.position.z)*1.5;
    if(x>0&&x<184&&y>0&&y<184){mc.beginPath();mc.arc(x,y,3,0,7);mc.fill();}
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  if(playing){
    elapsed+=dt;
    spawnTimer-=dt;
    fireTimer-=dt;
    if(spawnTimer<=0&&zombies.length<Math.min(7+wave*2,22)){
      spawnZombie();spawnTimer=Math.max(.6,2.7-wave*.15);
    }
    if(shooting&&fireTimer<=0){shoot();fireTimer=.22;}

    const speed=sprinting?9:5.5;
    const moveX=joyX,moveZ=joyY;
    if(Math.abs(moveX)+Math.abs(moveZ)>.08){
      const forward=new THREE.Vector3(moveX,0,moveZ);
      // Movement follows the camera's horizontal orientation.
      const cameraForward=new THREE.Vector3();
      camera.getWorldDirection(cameraForward);
      cameraForward.y=0;cameraForward.normalize();
      const right=new THREE.Vector3().crossVectors(cameraForward,new THREE.Vector3(0,1,0)).normalize();
      const delta=right.multiplyScalar(moveX).add(cameraForward.multiplyScalar(-moveZ));
      if(delta.lengthSq()>.001){
        delta.normalize();
        player.position.addScaledVector(delta,speed*dt);
        player.rotation.y=Math.atan2(-delta.x,-delta.z);
      }
    }

    for(const z of zombies){
      const dx=player.position.x-z.g.position.x;
      const dz=player.position.z-z.g.position.z;
      const d=Math.hypot(dx,dz)||1;
      if(d>1.4){
        z.g.position.x+=dx/d*z.speed*dt;
        z.g.position.z+=dz/d*z.speed*dt;
        z.g.lookAt(player.position.x,0,player.position.z);
      }else{
        z.attack-=dt;
        if(z.attack<=0){
          health-=8;z.attack=.8;updateHUD();
          if(health<=0){health=0;updateHUD();gameOver();}
        }
      }
    }

    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.mesh.position.addScaledVector(b.dir,48*dt);
      b.life-=dt;
      if(b.life<=0){scene.remove(b.mesh);bullets.splice(i,1);}
    }
  }

  // Camera trails the player for a third-person view.
  const offset=new THREE.Vector3(0,7.5,12).applyQuaternion(player.quaternion);
  const desired=player.position.clone().add(offset);
  camera.position.lerp(desired,.09);
  camera.lookAt(player.position.x,1.2,player.position.z-2);

  drawMini();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
</body>
  </html>
